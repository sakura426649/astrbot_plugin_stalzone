name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CJK font (Linux)
        run: |
          set -e
          font=/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
          url=https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTC/NotoSansCJK-Regular.ttc
          if curl -L --fail --retry 5 --retry-delay 2 --max-time 180 -o /tmp/NotoSansCJK-Regular.ttc "$url"; then
            sudo mkdir -p "$(dirname "$font")"
            sudo install -m 644 /tmp/NotoSansCJK-Regular.ttc "$font"
          else
            echo "Direct font download failed; falling back to apt"
            sudo timeout 180 apt-get update || true
            sudo timeout 180 apt-get install -y fonts-noto-cjk || true
          fi
          fc-cache -f >/dev/null 2>&1 || true
          test -s "$font"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build plugin zip and checksum
        run: |
          rm -rf package astrbot_plugin_stalzone.zip SHA256SUMS
          mkdir -p package/astrbot_plugin_stalzone
          git archive HEAD | tar -x -C package/astrbot_plugin_stalzone
          (cd package && zip -r ../astrbot_plugin_stalzone.zip astrbot_plugin_stalzone)
          sha256sum astrbot_plugin_stalzone.zip > SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            astrbot_plugin_stalzone.zip
            SHA256SUMS
          generate_release_notes: true
          body: |
            STALZONE 数据查询安装包。

            完整变更见仓库中的 CHANGELOG.md；安装包内包含插件源码、物品索引、离线图标、预览图和许可证。
