name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CJK font (Linux)
        run: |
          set -e
          font=/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
          url=https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTC/NotoSansCJK-Regular.ttc
          if curl -L --fail --retry 5 --retry-delay 2 --max-time 180 -o /tmp/NotoSansCJK-Regular.ttc "$url"; then
            sudo mkdir -p "$(dirname "$font")"
            sudo install -m 644 /tmp/NotoSansCJK-Regular.ttc "$font"
          else
            echo "Direct font download failed; falling back to apt"
            sudo timeout 180 apt-get update || true
            sudo timeout 180 apt-get install -y fonts-noto-cjk || true
          fi
          fc-cache -f >/dev/null 2>&1 || true
          test -s "$font"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Prepare full icon source
        run: |
          git fetch --depth=1 origin icons-full
          rm -rf full_icons && mkdir -p full_icons
          git archive origin/icons-full item_icons | tar -x -C full_icons
      - name: Build marketplace and full plugin zips
        run: |
          rm -f astrbot_plugin_stalzone.zip astrbot_plugin_stalzone_full.zip stalzone_icons_full.zip SHA256SUMS
          python tools/build_package.py --output-dir . --full-icon-source full_icons/item_icons
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            astrbot_plugin_stalzone.zip
            astrbot_plugin_stalzone_full.zip
            SHA256SUMS
          generate_release_notes: true
          body: |
            STALZONE 数据查询安装包。

            完整变更见仓库中的 CHANGELOG.md。

            - `astrbot_plugin_stalzone.zip`：插件市场用，控制在 16 MiB 内，内置 826 个常用图标。
            - `astrbot_plugin_stalzone_full.zip`：GitHub 用户用，内置全部 2,600 个图标，可直接安装，无需再补图标。

            如果使用市场小包，也可从 `icons-full` 分支单独下载完整图标：`https://github.com/sakura426649/astrbot_plugin_stalzone/archive/refs/heads/icons-full.zip`，把 `item_icons/` 解压到 `data/plugin_data/astrbot_plugin_stalzone/` 后重载插件。
