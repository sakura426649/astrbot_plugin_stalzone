name: tests

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CJK font (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          font=/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
          url=https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTC/NotoSansCJK-Regular.ttc
          if curl -L --fail --retry 5 --retry-delay 2 --max-time 180 -o /tmp/NotoSansCJK-Regular.ttc "$url"; then
            sudo mkdir -p "$(dirname "$font")"
            sudo install -m 644 /tmp/NotoSansCJK-Regular.ttc "$font"
          else
            echo "Direct font download failed; falling back to apt"
            sudo timeout 180 apt-get update || true
            sudo timeout 180 apt-get install -y fonts-noto-cjk || true
          fi
          fc-cache -f >/dev/null 2>&1 || true
          test -s "$font"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests with coverage
        run: |
          python -m coverage run --source=. --omit="tests/*" -m unittest discover -s tests -v
          python -m coverage report
