name: astrbot_plugin_stalzone
display_name: STALZONE 数据查询
short_desc: 查询 STALZONE 拍卖、爆发、角色、战队和物品
desc: >-
  通过官方 STALZONE API 在 QQ 群内查询拍卖在售/成交、辐射爆发、角色资料、战队、行动记录和物品；
  支持 OneBot 与 QQ 官方机器人（qq_official / qq_official_webhook）；支持中文/英文物品名解析到 ID；
  输出可选卡片图片或纯文本。实时数据不写入知识库，默认区服可配置为 ru/eu/na/sea/nea。
version: 1.2.2
author: Sakura_Akira
repo: "https://github.com/sakura426649/astrbot_plugin_stalzone"
license: MIT
tags:
  - STALZONE
  - 游戏查询
  - 拍卖行
  - QQ机器人
astrbot_version: ">=4.0.0"
compatibility:
  min_astrbot_version: "4.0.0"
platforms:
  - aiocqhttp
  - qq
  - qq_official
  - qq_official_webhook
support_platforms:
  - aiocqhttp
  - qq_official
  - qq_official_webhook
